[package]
name = "alias-manager"
version = "0.1.0"
edition = "2021"
description = "A fullscreen TUI for managing Bash and Zsh aliases"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
