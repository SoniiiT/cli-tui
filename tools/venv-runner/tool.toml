status = "unverified"
evidence = ""

[platforms.macos]
status = "supported"
evidence = "macOS 27.0.0 (Darwin) arm64, 2026-10-12: cargo test (93 passed, incl. tests that create a real venv from a real interpreter, install from a requirements file, update it in place with real pip offline, run code inside it, and delete venvs incl. the path/symlink safeguards), cargo clippy -D warnings, cargo fmt --check, cargo build --release all passed natively. Core path exercised against the release binary in a real pty with terminal emulation (pexpect + pyte, 138 checks): venv detection incl. a broken one, create form with .python-version preselection and validation, venv creation + pip install step in the real terminal, update dialog (defaults, live command preview, cancel, in-place package update 1.0 -> 2.0 with offline wheels, failing update keeps the venv, nothing-selected error, broken venv refused, and a real `pip install --upgrade pip` over the network 25.0.1 -> 26.2.1), delete with y-only confirmation (cancel keys, broken venv, symlinked venv where only the link goes and the target survives, project files untouched), start with stdin/input() and pdb working, VIRTUAL_ENV/PATH set, Ctrl+C delivered to the Python program while the TUI survives, exit codes/signals reported, quoted run arguments, a project path with a space and an umlaut, q from the return prompt, and clean alternate-screen/cursor restore on exit. Not tested: terminal resize, tmux/screen, projects on network volumes."
