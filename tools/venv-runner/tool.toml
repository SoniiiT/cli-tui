id = "venv-runner"
name = "Venv Runner"
purpose = "Fullscreen TUI that finds or creates a Python virtual environment in a project and runs the project in it directly in your terminal."
runtime = ["Python 3 with the venv and ensurepip modules (to create venvs)"]
build = ["Rust stable (Cargo)"]

